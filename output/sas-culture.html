<script>
(function(){
  var root = document.getElementById('sas-culture');
  if (!root) return;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Photo slideshow: always automatic (every 2.5s) ----------
     Pauses only when: off screen, browser tab hidden, keyboard focus is on
     the slideshow, or the visitor presses the pause button. */
  var slider = root.querySelector('.sas-culture-slider');
  var slides = root.querySelectorAll('.sas-culture-slide');
  var toggle = root.querySelector('.sas-culture-toggle');
  var current = 0, timer = null;
  var userPaused = false;
  var onScreen = false, focused = false;

  function show(i){
    var n = slides.length;
    current = (i + n) % n;
    slides.forEach(function(s, k){
      s.classList.remove('sas-culture-active', 'sas-culture-prev', 'sas-culture-next');
      if (k === current) s.classList.add('sas-culture-active');
      else if (k === (current - 1 + n) % n) s.classList.add('sas-culture-prev');
      else if (k === (current + 1) % n) s.classList.add('sas-culture-next');
    });
  }

  function update(){
    var run = !userPaused && onScreen && !focused && !document.hidden;
    if (run && !timer) timer = setInterval(function(){ show(current + 1); }, 2500);
    if (!run && timer) { clearInterval(timer); timer = null; }
  }

  function setPaused(p){
    userPaused = p;
    toggle.classList.toggle('is-paused', p);
    toggle.setAttribute('aria-label', p ? 'Play slideshow' : 'Pause slideshow');
    update();
  }

  if (slides.length) {
    show(0);
    if (slides.length > 1 && toggle) {
      toggle.hidden = false;
      setPaused(false);
      toggle.addEventListener('click', function(){ setPaused(!userPaused); });
      slider.addEventListener('focusin', function(){ focused = true; update(); });
      slider.addEventListener('focusout', function(){ focused = false; update(); });
      document.addEventListener('visibilitychange', update);
      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function(entries){ onScreen = entries[0].isIntersecting; update(); }, { threshold: 0.2 }).observe(slider);
      } else { onScreen = true; update(); }
    }
  }

  /* ---------- Culture video (YouTube, privacy-enhanced) ---------- */
  var modal = document.getElementById('sas-culture-modal');
  var frameBox = modal && modal.querySelector('.sas-culture-modal-video');
  var closeBtn = modal && modal.querySelector('.sas-culture-modal-close');
  var trigger = null;

  function openVideo(id, btn){
    if (!modal || typeof modal.showModal !== 'function') {
      window.open('https://www.youtube.com/watch?v=' + id, '_blank', 'noopener');
      return;
    }
    trigger = btn;
    frameBox.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id +
      '?autoplay=1&rel=0" title="Strategic Assistant Staffing team culture video" ' +
      'allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    modal.showModal();
    document.documentElement.style.overflow = 'hidden';
    closeBtn.focus();
  }

  root.querySelectorAll('.sas-culture-video-card').forEach(function(btn){
    btn.addEventListener('click', function(){ openVideo(btn.getAttribute('data-video'), btn); });
  });

  if (modal) {
    closeBtn.addEventListener('click', function(){ modal.close(); });
    modal.addEventListener('click', function(e){ if (e.target === modal) modal.close(); });
    modal.addEventListener('close', function(){
      frameBox.innerHTML = '';
      document.documentElement.style.overflow = '';
      if (trigger) trigger.focus();
      trigger = null;
    });
  }

  /* ---------- Scroll reveal ---------- */
  if (!('IntersectionObserver' in window) || reduceMotion) return;
  root.classList.add('sas-js-reveal');
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){ e.target.classList.add('is-visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  root.querySelectorAll('.sas-reveal').forEach(function(el){ io.observe(el); });
})();
</script>
