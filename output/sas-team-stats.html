<style>

/* =========================================
   SAS TEAM STATS — ROOT + DESIGN TOKENS
========================================= */

#sas-team-stats {

    /* Colours */
    --sas-bg: #000000;
    --sas-surface: rgba(15,15,15,0.9);
    --sas-gold: #D6A743;
    --sas-gold-hover: #E2B85A;
    --sas-white: #FFFFFF;
    --sas-muted: #AAAAAA;
    --sas-border: rgba(255,255,255,0.08);

    /* Type */
    --sas-font: "Inter", Arial, Helvetica, sans-serif;
    --sas-fs-eyebrow: 13px;
    --sas-fs-h1: clamp(38px, 3.6vw + 14px, 64px);
    --sas-fs-h2: clamp(30px, 2.4vw + 14px, 48px);
    --sas-fs-h3: clamp(20px, 0.8vw + 14px, 24px);
    --sas-fs-body: clamp(16px, 0.25vw + 15px, 18px);
    --sas-fs-small: 15px;
    --sas-fs-btn: 15px;

    /* Layout */
    --sas-gutter: clamp(20px, 4vw, 64px);
    --sas-max: 1440px;
    --sas-section-y: 0px;               /* top/bottom spacing is set in GHL */

    /* Motion */
    --sas-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --sas-dur: 0.8s;

    /* Full-width breakout from the GHL row */
    position: relative;
    width: 100vw !important;
    max-width: 100vw !important;
    left: 50%;
    right: 50%;
    margin: 0 -50vw !important;
    padding: var(--sas-section-y) var(--sas-gutter);
    box-sizing: border-box;

    background: var(--sas-bg);
    color: var(--sas-white);
    font-family: var(--sas-font);
    -webkit-font-smoothing: antialiased;
}

#sas-team-stats *,
#sas-team-stats *::before,
#sas-team-stats *::after {
    box-sizing: border-box;
}


/* =========================================
   CONTAINER
========================================= */

#sas-team-stats .sas-team-stats-inner {
    width: 100%;
    max-width: var(--sas-max);
    margin: 0 auto;
}


/* =========================================
   STATS GRID
========================================= */

#sas-team-stats .sas-team-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
    width: 100%;
    margin: 0;
    padding: 0;
    list-style: none;
}

#sas-team-stats .sas-team-stats-item {
    min-width: 0;
    margin: 0;
    padding: 0;
}


/* =========================================
   CARD (SAS standard)
========================================= */

#sas-team-stats .sas-team-stats-card {
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 245px;
    min-width: 0;
    padding: 36px 24px;
    text-align: center;
    background:
        linear-gradient(145deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.018) 38%, rgba(0,0,0,0.20) 100%),
        rgba(10,10,10,0.62);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 28px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        inset 0 -1px 0 rgba(255,255,255,0.015),
        0 25px 70px rgba(0,0,0,0.30);
    transition:
        transform 0.35s var(--sas-ease),
        border-color 0.35s var(--sas-ease);
}

/* Soft top highlight (same as hero image card) */
#sas-team-stats .sas-team-stats-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 42%;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.035), transparent);
}

#sas-team-stats .sas-team-stats-icon,
#sas-team-stats .sas-team-stats-value,
#sas-team-stats .sas-team-stats-label {
    position: relative;
    z-index: 2;
}

#sas-team-stats .sas-team-stats-card:hover {
    transform: translateY(-4px);
    border-color: rgba(214,167,67,0.22);
}


/* =========================================
   ICON
========================================= */

#sas-team-stats .sas-team-stats-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    width: 54px;
    height: 54px;
    margin: 0 auto 22px;
    color: var(--sas-gold);
    background: rgba(255,255,255,0.035);
    border: 1px solid var(--sas-border);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.035);
}

#sas-team-stats .sas-team-stats-icon svg {
    display: block;
    width: 25px;
    height: 25px;
}


/* =========================================
   STAT NUMBER + LABEL
========================================= */

#sas-team-stats .sas-team-stats-value {
    margin: 0 0 10px;
    color: var(--sas-gold);
    font-family: var(--sas-font);
    font-size: var(--sas-fs-h2);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    white-space: nowrap;
}

#sas-team-stats .sas-team-stats-label {
    max-width: 190px;
    margin: 0;
    color: var(--sas-muted);
    font-family: var(--sas-font);
    font-size: var(--sas-fs-eyebrow);
    font-weight: 800;
    line-height: 1.5;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    overflow-wrap: break-word;
}


/* =========================================
   SCROLL REVEAL (SAS standard)
========================================= */

#sas-team-stats.sas-js-reveal .sas-reveal {
    opacity: 0;
    transform: translate3d(0,24px,0);
    transition: opacity var(--sas-dur) var(--sas-ease), transform var(--sas-dur) var(--sas-ease);
    transition-delay: var(--sas-delay, 0s);
}

#sas-team-stats.sas-js-reveal .sas-reveal.is-visible {
    opacity: 1;
    transform: none;
}


/* =========================================
   TABLET (≤860px)
========================================= */

@media (max-width: 860px) {

    #sas-team-stats .sas-team-stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
    }

    #sas-team-stats .sas-team-stats-card {
        min-height: 220px;
    }

}


/* =========================================
   MOBILE (≤600px)
========================================= */

@media (max-width: 600px) {

    #sas-team-stats {
        --sas-fs-eyebrow: 12px;
    }

    #sas-team-stats .sas-team-stats-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
    }

    #sas-team-stats .sas-team-stats-card {
        min-height: 190px;
        padding: 30px 20px;
        border-radius: 24px;
    }

    #sas-team-stats .sas-team-stats-icon {
        width: 50px;
        height: 50px;
        margin-bottom: 18px;
    }

}


/* =========================================
   SMALL MOBILE (≤480px)
========================================= */

@media (max-width: 480px) {

    #sas-team-stats {
        --sas-gutter: 16px;
    }

    #sas-team-stats .sas-team-stats-card {
        border-radius: 20px;
    }

}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    #sas-team-stats *,
    #sas-team-stats *::before,
    #sas-team-stats *::after {
        animation: none !important;
        transition: none !important;
    }

    #sas-team-stats .sas-reveal {
        opacity: 1 !important;
        transform: none !important;
    }

    #sas-team-stats .sas-team-stats-card:hover {
        transform: none;
    }

}

</style>


<script>
(function(){
  var root = document.getElementById('sas-team-stats');
  if (!root || !('IntersectionObserver' in window)) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.classList.add('sas-js-reveal');
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting){ e.target.classList.add('is-visible'); io.unobserve(e.target); }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
  root.querySelectorAll('.sas-reveal').forEach(function(el){ io.observe(el); });
})();
</script>
