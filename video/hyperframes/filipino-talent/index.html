<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"website","type":"string","label":"Website","default":"strategic-assistant.com"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000;
        --ink: #ffffff;
        --gold: #d6a743;
        --gold-light: #f7d774;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #regine {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 78%, rgba(0, 0, 0, 0.1) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.5" data-width="1080" data-height="1920">
      <div id="stage">
        <video
          id="regine"
          class="clip"
          data-start="0"
          data-duration="32.7"
          data-track-index="0"
          data-has-audio="true"
          playsinline
          src="assets/regine.mp4"
          style="z-index: 1"
        ></video>
      </div>
      <div id="scrim" class="clip" data-start="0" data-duration="31.2" data-track-index="1" style="z-index: 2"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="traits" data-composition-id="traits" data-composition-src="compositions/traits.html" data-start="3.6" data-duration="8.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html" data-start="12" data-duration="10.75" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="founder" data-composition-id="founder" data-composition-src="compositions/founder.html" data-start="22.6" data-duration="8.4" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="31" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="30.9" data-duration="3.6" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Jump-cut punch-ins on emphasis lines; the face is centred, so scale from the middle.
      const punches = [
        [3.6, 1.12],
        [6.55, 1.0],
        [12.15, 1.12],
        [17.5, 1.0],
        [22.8, 1.12],
        [25.5, 1.0],
        [28.65, 1.15],
      ];
      tl.set("#stage", { scale: 1, transformOrigin: "50% 52%" }, 0);
      punches.forEach(([at, s]) => tl.set("#stage", { scale: s }, at));
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
