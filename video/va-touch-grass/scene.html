<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VA Touches Grass</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #stage canvas { display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: "Inter", Arial, sans-serif; }
  .cap {
    position: absolute; left: 50%; top: 250px; transform: translateX(-50%);
    padding: 22px 38px; border-radius: 26px; background: #fff; color: #111;
    font-weight: 800; font-size: 54px; line-height: 1.15; text-align: center; white-space: nowrap;
    box-shadow: 0 10px 0 rgba(0,0,0,.18);
  }
  .bub {
    position: absolute; padding: 18px 28px; border-radius: 26px; color: #fff;
    font-weight: 700; font-size: 40px; white-space: nowrap; box-shadow: 0 10px 24px rgba(0,0,0,.35);
    transform-origin: 50% 100%;
  }
  .bub small { display: block; font-size: 26px; font-weight: 600; opacity: .8; margin-bottom: 4px; }
  .pop {
    position: absolute; left: 50%; transform: translate(-50%, -50%);
    font-weight: 900; color: #fff; text-align: center; white-space: nowrap;
    -webkit-text-stroke: 10px #1b1b1b; paint-order: stroke fill;
  }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="ui">
    <div id="vignette"></div>
    <div id="flash"></div>
  </div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
